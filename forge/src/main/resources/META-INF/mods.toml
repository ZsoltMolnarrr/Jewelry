modLoader = "javafml"
loaderVersion = "[47,)"
issueTrackerURL = "https://github.com/zsoltmolnarrr/Jewelry/issues"
license = "All Rights Reserved"

[[mods]]
modId = "jewelry"
version = "${version}"
displayName = "Jewelry (RPG Series)"
authors = "Daedelus"
description = '''
Find precious gems deep down, and craft them into powerful jewelry!
'''
logoFile = "icon.png"

[[dependencies.jewelry]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.jewelry]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.jewelry]]
modId = "spell_power"
mandatory = true
versionRange = "[1.6,)"
ordering = "NONE"
side = "BOTH"

# RangedWeaponAPI has no Forge build on 1.20.1. The `ranged_weapon:*` attributes are resolved by
# registry id at item-registration time, so the dependency is optional on both loaders.
[[dependencies.jewelry]]
modId = "ranged_weapon_api"
mandatory = false
versionRange = "[1,)"
ordering = "AFTER"
side = "BOTH"

# StructurePoolAPI injects the jewelry shop into the *vanilla* village pools. Since 1.2.1 it has a
# Forge artifact, so this is a hard dependency on both loaders (mirrors the `fabric.mod.json` entry).
[[dependencies.jewelry]]
modId = "structure_pool_api"
mandatory = true
versionRange = "[1.2.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.jewelry]]
modId = "curios"
mandatory = false
versionRange = "[5,)"
ordering = "AFTER"
side = "BOTH"
