architectury {
    common rootProject.enabled_platforms.split(',')
}

// Dummy platform for common compile
def platform = "fabric";

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url 'https://maven.fabricmc.net' }

    mavenLocal()
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    // No Fabric API in common: there is no Forgified Fabric API on the 1.20.1 line, so loader API
    // usage stays in the platform modules (fabric/ and forge/).

    // Ecosystem libraries: the Modrinth maven for the released ones, mavenLocal for the 1.20.1-modern ports.
    modImplementation("maven.modrinth:tiny-config:${rootProject.tiny_config_version}-${platform}")
    modImplementation("net.spell_power:spell_power-${platform}:${rootProject.spell_power_version}")

    // StructurePoolAPI 1.2.1+ ships a Forge artifact too, and its `injectAll` touches no loader API,
    // so the village injection and the `config/jewelry/villages.json` config live here in `common`.
    // Modrinth serves only the per-loader jars, so `common` compiles against the `-fabric` flavour
    // (this module's dummy platform). NOT JiJ'd: it is a standalone library mod the player installs.
    modImplementation("maven.modrinth:structure-pool-api:${rootProject.structure_pool_api_version}-fabric")

    // RangedWeaponAPI is deliberately NOT on the compile classpath even though a two-platform 1.20.1
    // artifact now exists: `ranged_weapon:*` attributes are only ever config id strings, resolved from
    // the attribute registry at item-registration time and skipped when RWA is absent.
}
