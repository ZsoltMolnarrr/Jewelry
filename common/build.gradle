architectury {
    common rootProject.enabled_platforms.split(',')
}

// Dummy platform for common compile
def platform = "fabric";

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url = 'https://maven.fabricmc.net' }
    maven { url = 'https://maven.shedaniel.me/' } // REI

    mavenLocal()
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$project.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$project.fabric_api_version"

    modImplementation("maven.modrinth:tiny-config:${project.tiny_config_version}-${platform}")

//    modImplementation("maven.modrinth:structure-pool-api:${project.structure_pool_api_version}-${platform}")
    modImplementation("net.rpg_foundation:structure_pool_api-${platform}:${project.structure_pool_api_version}")
//    modImplementation("maven.modrinth:spell-power:${project.spell_power_version}-${platform}")
    modImplementation("net.spell_power:spell_power-${platform}:${project.spell_power_version}")
//    modImplementation("maven.modrinth:ranged-weapon-api:${project.ranged_weapon_api_version}-${platform}")
    modImplementation("net.rpg_foundation:ranged_weapon_api-${platform}:${project.ranged_weapon_api_version}")

    // Compat only
    // modCompileOnly("maven.modrinth:spell-engine:${project.spell_engine_version}-${platform}")

    // REI (recipe viewer) — the loader-neutral `RoughlyEnoughItems-api` artifact is intermediary-mapped,
    // so it must go through Loom (`modCompileOnly`) to be remapped into this module's Yarn namespace.
    // Compile-only: `net.jewelry.compat.rei` is only ever class-loaded by REI, so the mod runs fine without it.
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api:${project.rei_version}"

    // EMI (optional integration) — PARKED, no build past 1.21.1 (see gradle.properties).
    // The `xplat-intermediary` `api` artifact is the loader-neutral subset EMI publishes for
    // Architectury common modules. Compile-only: `net.jewelry.compat.emi` is only ever class-loaded
    // by EMI itself, so the mod runs fine without EMI present.
    //modCompileOnly "dev.emi:emi-xplat-intermediary:${project.emi_version}:api"

    // Compatibility
    // Fabric specific
}

sourceSets.main.java {
    // EMI is parked (see gradle.properties): the plugin sources stay in-tree but never compile.
    exclude 'net/jewelry/compat/emi/**'
}
