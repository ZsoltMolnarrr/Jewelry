# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Game
minecraft_version=26.3
# Game versions this build is released for: colon separated, oldest first; the first one is the manifest minimum.
#   single: minecraft_compat_versions=26.3     multiple: minecraft_compat_versions=26.3:26.3.1
minecraft_compat_versions=26.3

# Loader
enabled_platforms = fabric,neoforge
fabric_loader_version=0.19.5
neoforge_version = 26.3.0.3-beta

# Mod
maven_group=net.rpg_series
archives_name=jewelry
mod_version=2.4.1.001

# Dependencies
fabric_api_version=0.160.6+26.3

# TODO 26.3: TinyConfig has no 26.3 build (Modrinth checked 2026-09-20); 4.0.1 is proven to load on 26.3 (SpellPower, Critical Strike).
tiny_config_version=4.0.1

# TODO 26.3: the RPG Series upstreams come from mavenLocal (no 26.3 Modrinth releases yet) — 4-part dev
# versions. Flip the `maven.modrinth:*` lines in the three build.gradle files back on once released.
structure_pool_api_version=1.3.0.001+26.3
spell_power_version=1.6.2.001+26.3
ranged_weapon_api_version=4.0.0.001+26.3

spell_engine_version=1.10.7.006+26.3
cloth_config_version=26.3.158
player_anim_version=1.2.7+mc.26.3

# Fabric only
trinkets_version=4.2.0+26.3

# NeoForge only
# TODO 26.3 (Curios): Curios has no 26.3 build (Modrinth checked 2026-09-20), and its 26.2 API jar no longer
# compiles against NeoForge 26.3.0.3-beta (`IDynamicStackHandler extends net.neoforged.neoforge.items.IItemHandlerModifiable`,
# a package NeoForge 26.3 removed). Gated off: when false, `neoforge/.../compat/curios/**` is excluded from
# compilation, the dependency is not declared, and `neoforge/.../compat/CompatFeatures` resolves the bridge
# reflectively (and finds nothing). To restore once Curios ships for 26.3: set `enable_curios=true` and move
# `curios_version` to that build. NeoForge runtime verification is deferred until then.
enable_curios=false
curios_version=16.0.0+26.2
