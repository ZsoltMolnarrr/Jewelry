# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Game
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.1
minecraft_compat_version=1.20.1

# Loader
enabled_platforms = fabric,forge
fabric_loader_version=0.19.5
forge_version=1.20.1-47.4.22

# Mod
maven_group=net.rpg_series
archives_name=jewelry
mod_version=2.4.0.004

# Dependencies
fabric_api_version=0.92.12+1.20.1
# mavenLocal coordinates: net.tiny_config:tiny_config-<platform>:<version>
tiny_config_version=3.1.0.001
cloth_config_version=11.1.106
# PlayerAnimator 1.x (mod id `player-animator` on Fabric, `playeranimator` on Forge)
player_anim_version=1.0.2+1.19.4

# mavenLocal coordinates: net.spell_power:spell_power-<platform>:<version>
spell_power_version=1.6.0.001+1.20.1
# mavenLocal coordinates: net.spell_engine:spell_engine-<platform>:<version>
# Fabric only: the datagen providers extend SpellEngine's RPGSeriesDataGen. Jewelry has no
# SpellEngine dependency at runtime on either loader.
spell_engine_version=1.10.5.004+1.20.1
# mavenLocal coordinates: net.foundation:structure_pool_api-<platform>:<version>
# 1.2.1 is the first 1.20.1 build with a Forge artifact, so vanilla-village injection now runs on
# both loaders straight from `common` (no `VillageStructures` seam any more).
structure_pool_api_version=1.2.1.001+1.20.1
# RangedWeaponAPI is NOT a dependency on this line, by choice. A two-platform 1.20.1 artifact does exist
# (net.foundation:ranged_weapon_api-<platform>:2.3.4.001+1.20.1), but Jewelry only ever names
# `ranged_weapon:*` as config id strings (JewelryItems), resolved from the attribute registry at
# item-registration time and skipped when absent — so both loaders build and run without it, with no
# compile dependency and no `isModLoaded` holder class.
# See spellengine-port-notes.md §9.5 item 3.

# Fabric only
trinkets_version=3.7.2
# Trinkets 3.7.2 nests Cardinal Components, but Loom does not load nested jars of classpath mods.
cardinal_components_version=5.2.0

# Forge only
curios_version=5.14.1+1.20.1
# Forge 47 does not bundle MixinExtras; SpellEngine (a Fabric-side datagen dep) JiJs it in production.
mixin_extras_version=0.5.5
