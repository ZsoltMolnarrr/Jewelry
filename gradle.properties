# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Game
minecraft_version=26.3
# Game versions this build is released for: colon separated, oldest first; the first one is the manifest minimum.
#   single: minecraft_compat_versions=26.3     multiple: minecraft_compat_versions=26.3:26.3.1
minecraft_compat_versions=26.3

# Loader
enabled_platforms = fabric,neoforge
fabric_loader_version=0.19.5
neoforge_version = 26.3.0.33-beta

# Mod
maven_group=net.rpg_series
archives_name=jewelry
mod_version=2.5.1

# Dependencies
fabric_api_version=0.160.6+26.3

# TODO 26.3: TinyConfig has no 26.3 build (Modrinth checked 2026-09-20); 4.0.1 is proven to load on 26.3 (SpellPower, Critical Strike).
tiny_config_version=4.0.1

structure_pool_api_version=1.3.0+26.3
spell_power_version=1.6.2+26.3
ranged_weapon_api_version=4.0.0+26.3

spell_engine_version=1.10.9+26.3
cloth_config_version=26.3.158
player_anim_version=1.2.7+mc.26.3
# REI (Roughly Enough Items) — recipe-viewer integration for gem cutting at the Jeweler's Kit.
# Compile-only in `common`; never bundled, not a required dependency. (EMI has no builds past 1.21.1.)
rei_version=26.3.823

# EMI (optional recipe-viewer integration) — PARKED: EMI has never shipped past 1.21.1
# (latest 1.1.24+1.21.1), so there is nothing to compile against here. The plugin sources stay
# in-tree under `net/jewelry/compat/emi/` but are excluded from the compile unconditionally.
#
# To restore once EMI ships for this game version: uncomment the property below, then the
# EMI blocks in common/fabric/neoforge `build.gradle` (search for "EMI"), and re-add the `emi`
# entrypoint to fabric.mod.json:
#     "emi": [ "net.jewelry.compat.emi.JewelryEmiPlugin" ]
#emi_version=1.1.24+1.21.1

# Fabric only
trinkets_version=4.2.0+26.3

# NeoForge only
# `enable_curios` toggles the whole Curios integration: when false, `neoforge/.../compat/curios/**` is excluded
# from compilation, the dependency is not declared, and `neoforge/.../compat/CompatFeatures` resolves the bridge
# reflectively (and finds nothing) — the shape used while Curios had no build for the current game version.
enable_curios=true
curios_version=17.0.0-beta+26.3
